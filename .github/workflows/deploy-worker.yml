name: Deploy Noghreh API and D1

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noghreh-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOGHREH_ADMIN_TOKEN: ${{ secrets.NOGHREH_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$NOGHREH_ADMIN_TOKEN" || { echo "::error::Missing NOGHREH_ADMIN_TOKEN"; exit 1; }
          if [ "${#NOGHREH_ADMIN_TOKEN}" -lt 32 ]; then echo "::error::NOGHREH_ADMIN_TOKEN must be at least 32 characters"; exit 1; fi

      - name: Find or create D1 database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          list="$(curl --fail-with-body --silent --show-error --get "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-urlencode "name=noghreh-panel-db")"
          db_id="$(printf '%s' "$list" | jq -r '.result[]? | select(.name=="noghreh-panel-db") | .uuid' | head -n1)"
          if [ -z "$db_id" ]; then
            created="$(curl --fail-with-body --silent --show-error -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"noghreh-panel-db"}')"
            db_id="$(printf '%s' "$created" | jq -r '.result.uuid // empty')"
          fi
          test -n "$db_id" || { echo "::error::Could not find or create D1 database. Check token permissions."; exit 1; }
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Write D1 ID into Wrangler config
        working-directory: worker
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("wrangler.toml")
          text = p.read_text()
          text = text.replace('database_id = "REPLACE_WITH_D1_DATABASE_ID"', f'database_id = "{os.environ["D1_DATABASE_ID"]}"')
          p.write_text(text)
          PY

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply noghreh-panel-db --remote

      - name: Set admin token as encrypted Worker secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOGHREH_ADMIN_TOKEN: ${{ secrets.NOGHREH_ADMIN_TOKEN }}
        run: printf '%s' "$NOGHREH_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Show deployment host
        run: echo "Worker deployment finished. Find the exact workers.dev URL in this job's Wrangler output or Cloudflare dashboard."
