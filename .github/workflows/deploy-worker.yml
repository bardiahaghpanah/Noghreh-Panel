name: Deploy Noghreh API and D1

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noghreh-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Check required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOGHREH_ADMIN_TOKEN: ${{ secrets.NOGHREH_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub Actions secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret"; exit 1; }
          test -n "$NOGHREH_ADMIN_TOKEN" || { echo "::error::Missing NOGHREH_ADMIN_TOKEN GitHub Actions secret"; exit 1; }
          if [ "${#NOGHREH_ADMIN_TOKEN}" -lt 32 ]; then echo "::error::NOGHREH_ADMIN_TOKEN must be at least 32 characters"; exit 1; fi

      - name: Deploy Worker and provision D1 binding
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply noghreh-panel-db --remote

      - name: Set admin token as encrypted Worker secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOGHREH_ADMIN_TOKEN: ${{ secrets.NOGHREH_ADMIN_TOKEN }}
        run: printf '%s' "$NOGHREH_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Print API health-check address
        run: echo "After deployment, check https://noghreh-panel-api.<your-workers-subdomain>.workers.dev/api/health in your browser."
